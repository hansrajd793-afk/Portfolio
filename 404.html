<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 // Lost in the Void — Arcade Game | Hansraj D</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="You've drifted off trajectory into the void. Pilot your orbital defense ship and defend the core in this retro arcade mini-game before returning home.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://hansrajd.site/404.html">

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&family=Syne:wght@800&display=swap">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23050507%22/><text y=%2268%22 x=%2250%22 font-size=%2255%22 font-family=%22sans-serif%22 font-weight=%22800%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>HD</text></svg>">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050507;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a0a0ab;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3.5rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    p.subtext {
      color: #9a9aa2;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      max-width: 48ch;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Game Container */
    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 380px;
      background: #0a0a0e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      margin-bottom: 28px;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .game-hud {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
    }

    .game-instructions {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #707078;
      pointer-events: none;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 99px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #ffffff;
      color: #050507;
      border: 1px solid #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
    }

    .btn-primary:hover {
      background: #dcdce0;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-secondary:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>HTTP 404 // Signal Lost</span>
  </div>

  <h1>Lost In The Void</h1>

  <p class="subtext">
    The coordinates you requested do not exist in this sector. Defend the core from void anomalies while we recalculate trajectories.
  </p>

  <div class="game-wrapper">
    <canvas id="game-canvas"></canvas>
    <div class="game-hud">
      <div>SCORE: <span id="hud-score" style="color: #ffffff; font-weight: 700;">0</span></div>
      <div>HIGH: <span id="hud-high" style="color: #a0a0ab;">0</span></div>
    </div>
    <div class="game-instructions">
      DESKTOP: Move Mouse to Steer &amp; Click to Fire | TOUCH: Drag &amp; Tap
    </div>
  </div>

  <div class="actions-row">
    <a href="index.html" class="btn btn-primary">[ Return to Home ]</a>
    <a href="index.html#projects" class="btn btn-secondary">[ Explore Projects ]</a>
    <button id="btn-restart-game" class="btn btn-secondary">[ Restart Game ]</button>
  </div>

  <!-- Arcade Game Script -->
  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const hudScore = document.getElementById('hud-score');
    const hudHigh = document.getElementById('hud-high');
    const btnRestart = document.getElementById('btn-restart-game');

    let width, height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    // High Score
    let highScore = parseInt(localStorage.getItem('hd_404_high') || '0', 10);
    hudHigh.textContent = highScore;

    // Game State
    let score = 0;
    let gameOver = false;
    let player = {
      x: width / 2,
      y: height - 50,
      radius: 12,
      targetX: width / 2,
      targetY: height - 50
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let spawnTimer = 0;

    function resetGame() {
      score = 0;
      gameOver = false;
      player.x = width / 2;
      player.y = height - 50;
      player.targetX = width / 2;
      player.targetY = height - 50;
      bullets = [];
      enemies = [];
      particles = [];
      hudScore.textContent = '0';
    }

    btnRestart.addEventListener('click', resetGame);

    // Mouse & Touch Controls
    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.targetX = e.clientX - rect.left;
      player.targetY = Math.max(height * 0.4, Math.min(height - 20, e.clientY - rect.top));
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (gameOver) {
        resetGame();
        return;
      }
      fireBullet();
    });

    function fireBullet() {
      bullets.push({
        x: player.x,
        y: player.y - 14,
        speed: 9
      });
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameOver) resetGame();
        else fireBullet();
      }
    });

    function createExplosion(x, y, color = '#ffffff') {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.04 + 0.02,
          color
        });
      }
    }

    function update() {
      if (gameOver) return;

      // Player easing
      player.x += (player.targetX - player.x) * 0.2;
      player.y += (player.targetY - player.y) * 0.2;

      // Bullets
      bullets.forEach((b, idx) => {
        b.y -= b.speed;
        if (b.y < -10) bullets.splice(idx, 1);
      });

      // Spawn Enemies
      spawnTimer++;
      if (spawnTimer % 35 === 0) {
        enemies.push({
          x: Math.random() * (width - 40) + 20,
          y: -20,
          radius: Math.random() * 10 + 12,
          speed: Math.random() * 2 + 1.8,
          rotation: 0,
          rotSpeed: (Math.random() - 0.5) * 0.08
        });
      }

      // Enemies
      enemies.forEach((enemy, eIdx) => {
        enemy.y += enemy.speed;
        enemy.rotation += enemy.rotSpeed;

        // Collision with bullets
        bullets.forEach((bullet, bIdx) => {
          const dist = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);
          if (dist < enemy.radius + 6) {
            createExplosion(enemy.x, enemy.y, '#ffffff');
            enemies.splice(eIdx, 1);
            bullets.splice(bIdx, 1);
            score += 10;
            hudScore.textContent = score;

            if (score > highScore) {
              highScore = score;
              hudHigh.textContent = highScore;
              localStorage.setItem('hd_404_high', highScore);
            }
          }
        });

        // Collision with player
        const pDist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (pDist < enemy.radius + player.radius) {
          createExplosion(player.x, player.y, '#ff3b30');
          gameOver = true;
        }

        if (enemy.y > height + 30) {
          enemies.splice(eIdx, 1);
        }
      });

      // Particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(idx, 1);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Stars background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      for (let i = 0; i < 20; i++) {
        const sx = ((i * 73 + Date.now() * 0.02) % width);
        const sy = (i * 37) % height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Draw Player Ship (Sleek Chrome Arrow)
      if (!gameOver) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(10, 10);
        ctx.lineTo(0, 6);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Draw Bullets
      ctx.fillStyle = '#ffffff';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 1.5, b.y, 3, 10);
      });

      // Draw Enemies (Geometric Anomaly Shards)
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rotation);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.strokeRect(-e.radius, -e.radius, e.radius * 2, e.radius * 2);
        ctx.restore();
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
        ctx.restore();
      });

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(5, 5, 7, 0.85)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 24px "Syne", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CORE COMPROMISED', width / 2, height / 2 - 10);
        ctx.font = '400 13px "JetBrains Mono", monospace';
        ctx.fillStyle = '#9a9aa2';
        ctx.fillText('CLICK OR TAP TO RESPAWN', width / 2, height / 2 + 20);
      }

      update();
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
